<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HealerP</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
      color: #fff;
    }
    main {
      position: relative;
      width: min(100vw, calc(100svh * 16 / 9));
      aspect-ratio: 16 / 9;
      overflow: hidden;
    }
    canvas { display: block; width: 100%; height: auto; }
    h1 {
      position: absolute;
      top: 33.33%;
      left: 2.5%;
      margin: 0;
      font: italic 400 clamp(1.5rem, 2.8vw, 3rem) / 1.2 'Monotype Corsiva', Georgia, serif;
    }
    @media (orientation: portrait) {
      main { width: 100vw; height: 100svh; aspect-ratio: auto; }
      canvas {
        position: absolute;
        width: clamp(100%, calc(100svh * 1.53), 265%);
        left: 50%;
        top: 48%;
        transform: translate(-50%, -50%);
      }
      h1 {
        top: auto;
        bottom: max(3%, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        font-size: clamp(1.7rem, 6vw, 3rem);
      }
    }
  </style>
</head>
<body>
  <main>
    <canvas width="1600" height="900" aria-hidden="true"></canvas>
    <h1>HealerP</h1>
  </main>
  <!-- Canvas port of https://github.com/ZekangLi-Zico/Christmas-Tree -->
  <script>
    const canvas = document.querySelector('canvas');
    const context = canvas.getContext('2d', { alpha: false });
    const { width, height } = canvas;
    const frame = context.createImageData(width, height);
    const pixels = new Uint32Array(frame.data.buffer);
    const black = 0xff000000;
    const tau = Math.PI * 2;
    const treeHeight = 12;
    const cameraDistance = 13;
    const cameraHeight = 6;
    const pitchCos = Math.cos(-0.25);
    const pitchSin = Math.sin(-0.25);
    const random = Math.random;
    const between = (min, max) => min + (max - min) * random();
    const integer = (min, max) => Math.floor(between(min, max + 1));
    const clampColor = (value, min = 0) => Math.max(min, Math.min(255, value));
    const littleEndian = new Uint8Array(Uint32Array.of(1).buffer)[0] === 1;
    const color = littleEndian
      ? (r, g, b) => black | (b << 16) | (g << 8) | r
      : (r, g, b) => (r << 24) | (g << 16) | (b << 8) | 255;
    const background = color(0, 0, 0);
    const points = [];

    function branchRadius(h, base) {
      const tiers = Math.max(0, Math.sin((h * 5.8 + 0.15) * tau));
      return (1 - h) ** 1.1 * base * (1 + 0.65 * tiers);
    }

    function addTree() {
      for (let i = 0; i < 35000; i++) {
        const u = random();
        const h = u ** 1.6;
        const radius = branchRadius(h, 3.2) * between(0.85, 1.08);
        const angle = u * 9 * tau + between(-0.22, 0.22);
        const middle = Math.max(0.15, 1 - Math.abs(h - 0.55) * 1.5);
        const green = clampColor(155 + Math.floor(90 * middle) + integer(-15, 20));
        const blue = clampColor(185 + Math.floor(70 * middle) + integer(-15, 35));
        const light = random() < 0.08
          ? color(255, integer(220, 255), integer(230, 255))
          : color(255, green, blue);
        points.push([Math.cos(angle) * radius, treeHeight * h + 0.2, Math.sin(angle) * radius, light]);
      }
      for (let i = 0; i < 15000; i++) {
        const h = random() ** 1.9;
        const radius = branchRadius(h, 4.3) * Math.sqrt(random());
        const angle = random() * tau;
        const x = Math.cos(angle) * radius + between(-0.08, 0.08);
        const z = Math.sin(angle) * radius + between(-0.08, 0.08);
        const y = treeHeight * h + 0.2 + between(-0.08, 0.08);
        points.push([x, y, z, color(255, integer(165, 225), integer(190, 250))]);
      }
    }

    function addGroundAndStars() {
      const rings = [4.6, 6, 7.4, 8.8, 10.2, 11.4];
      for (let i = 0; i < 4000; i++) {
        const ring = rings[integer(0, rings.length - 1)];
        const jitter = Math.sqrt(-2 * Math.log(1 - random())) * Math.cos(random() * tau);
        const radius = ring + 0.3 * jitter;
        const angle = random() * tau;
        const shade = random() < 0.15 ? integer(235, 255) : integer(190, 235);
        points.push([Math.cos(angle) * radius, -0.25, Math.sin(angle) * radius, color(shade, shade, 255)]);
      }
      for (let i = 0; i < 1200; i++) {
        const shade = integer(215, 255);
        points.push([between(-18, 18), between(3, 18), between(-18, 18), color(shade, shade, 255)]);
      }
    }

    function addHeart() {
      let count = 0;
      while (count < 1000) {
        const x = between(-1.3, 1.3);
        const y = between(-1.4, 1.4);
        if ((x * x + y * y - 1) ** 3 - x * x * y ** 3 > 0) continue;
        const light = Math.max(0.35, 1.15 - 0.5 * Math.hypot(x, y));
        const green = clampColor(Math.floor(130 * light + 80), 120);
        const blue = clampColor(Math.floor(190 * light + 70), 120);
        points.push([x * 0.72, treeHeight + 0.05 + (y + 1) * 0.45, between(-0.18, 0.18), color(255, green, blue)]);
        count++;
      }
    }

    function makeFlake(initial = false) {
      const start = between(-80, -10);
      return {
        x: between(0, width),
        y: initial ? between(start, height + 50) : start,
        radius: between(10, 16),
        velocity: between(30, 45),
        travel: height + 80 - start,
      };
    }

    addTree();
    addGroundAndStars();
    addHeart();

    const flakes = Array.from({ length: 10 }, () => makeFlake(true));
    const snowLayers = [[1.3, 1 / 20], [1, 1 / 12], [0.75, 1 / 6], [0.55, 1 / 3], [0.45, 1]];
    const depthBuckets = new Int32Array(640);
    const nextPoint = new Int32Array(points.length);
    const screenX = new Int16Array(points.length);
    const screenY = new Int16Array(points.length);
    const pointRadius = new Uint8Array(points.length);
    const discRows = Array.from({ length: 4 }, (_, radius) => {
      return Array.from({ length: radius * 2 + 1 }, (_, row) => {
        return Math.floor(Math.sqrt(radius * radius - (row - radius) ** 2));
      });
    });

    function drawPoints(angle) {
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      depthBuckets.fill(-1);
      pixels.fill(background);

      // Bucket by depth so nearer particles cover farther ones without a per-frame sort.
      for (let i = points.length - 1; i >= 0; i--) {
        const [x, y, z] = points[i];
        const rotatedZ = x * sin + z * cos;
        const depth = y * pitchSin + rotatedZ * pitchCos + cameraDistance;
        if (depth <= 0.1) continue;
        const projection = height * 0.63 / depth;
        const px = Math.trunc(width / 2 + (x * cos - z * sin) * projection);
        const py = Math.trunc(height / 2 - (y * pitchCos - rotatedZ * pitchSin - cameraHeight) * projection);
        if (px < 0 || px >= width || py < 0 || py >= height) continue;
        screenX[i] = px;
        screenY[i] = py;
        pointRadius[i] = Math.max(1, Math.trunc(3.6 - depth * 0.13));
        const bucket = Math.min(depthBuckets.length - 1, Math.floor(depth * 16));
        nextPoint[i] = depthBuckets[bucket];
        depthBuckets[bucket] = i;
      }

      for (let bucket = depthBuckets.length - 1; bucket >= 0; bucket--) {
        for (let i = depthBuckets[bucket]; i !== -1; i = nextPoint[i]) {
          const x = screenX[i];
          const y = screenY[i];
          const radius = pointRadius[i];
          const light = points[i][3];
          const rows = discRows[radius];
          for (let py = Math.max(0, y - radius); py <= Math.min(height - 1, y + radius); py++) {
            const span = rows[py - y + radius];
            const end = py * width + Math.min(width - 1, x + span);
            for (let p = py * width + Math.max(0, x - span); p <= end; p++) pixels[p] = light;
          }
        }
      }
      context.putImageData(frame, 0, 0);
    }

    function drawSnow(seconds) {
      context.fillStyle = '#fff';
      for (let i = 0; i < flakes.length; i++) {
        let flake = flakes[i];
        flake.y += flake.velocity * seconds;
        if (flake.y > height + 50) flake = flakes[i] = makeFlake();
        const opacity = Math.min(1, (height + 80 - flake.y) / (flake.travel * 0.3));
        for (const [size, alpha] of snowLayers) {
          context.globalAlpha = opacity * alpha;
          context.beginPath();
          context.arc(flake.x, flake.y, flake.radius * size, 0, tau);
          context.fill();
        }
      }
      context.globalAlpha = 1;
    }

    let angle = 0;
    let previousTime;
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    function animate(time) {
      const seconds = previousTime === undefined ? 0 : Math.min(0.05, (time - previousTime) / 1000);
      previousTime = time;
      angle = (angle + seconds * 0.27) % tau;
      drawPoints(angle);
      drawSnow(seconds);
      if (!reducedMotion.matches) requestAnimationFrame(animate);
      else previousTime = undefined;
    }
    reducedMotion.addEventListener('change', () => {
      if (!reducedMotion.matches && previousTime === undefined) requestAnimationFrame(animate);
    });
    requestAnimationFrame(animate);
  </script>
</body>
</html>
